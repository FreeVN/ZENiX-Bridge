name: build

# Bouwt ZENiX Bridge op een Windows-runner en hangt de exe aan de release.
# Tag `v*` (bv. v2.3.1) = publieke release in DEZE repo.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}

      - name: JRE (jlink)
        shell: pwsh
        run: |
          jlink --add-modules java.base,java.desktop,java.xml,java.logging,java.naming,java.security.jgss `
                --strip-debug --no-man-pages --no-header-files --compress=2 --output app/jre
          ./app/jre/bin/java.exe -version

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cryptography openpyxl tkinterdnd2

      - name: PyInstaller onefile
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ZENiXBridge `
            --collect-all tkinterdnd2 `
            --add-data "app/build;app/build" `
            --add-data "app/jre;app/jre" `
            --add-data "app/assets;app/assets" `
            --add-data "app/lib;app/lib" `
            --paths app app/zenix_app.py
          Get-Item dist/ZENiXBridge.exe | Format-List Name,Length

      - name: Controleer jar-beleid in de binary
        shell: pwsh
        run: |
          $text = [System.Text.Encoding]::Latin1.GetString(
            [System.IO.File]::ReadAllBytes("dist/ZENiXBridge.exe"))
          $vendors = Get-ChildItem app/lib -Filter "configuration*.jar" -ErrorAction SilentlyContinue
          if ($vendors) {
            throw "vendor-jar hoort niet in de repo: $($vendors.Name -join ', ')"
          }
          if (-not $text.Contains("jaxb-api.jar")) {
            throw "binary bundelt jaxb-api.jar niet (--add-data app/lib ontbreekt?)"
          }
          Write-Host "geen vendor-jar gebundeld; jaxb-api.jar aanwezig"

      - name: Zelftest (enkel met vendor-jar lokaal)
        shell: pwsh
        run: |
          $vendors = Get-ChildItem app/lib -Filter "configuration*.jar" -ErrorAction SilentlyContinue
          if (-not $vendors) {
            Write-Host "geen configuration*.jar in app/lib: zelftest overgeslagen"
            exit 0
          }
          $stage = Join-Path $env:RUNNER_TEMP "ringbustool\modules\lib"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $vendors $stage
          Copy-Item app/lib/jaxb-api.jar $stage -ErrorAction SilentlyContinue
          $env:RINGBUSTOOL_HOME = $env:RUNNER_TEMP
          $p = Start-Process -FilePath "dist/ZENiXBridge.exe" -ArgumentList "--selftest" -Wait -PassThru
          Write-Host "exitcode: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "zelftest faalde ($($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/ZENiXBridge.exe

  release:
    runs-on: ubuntu-latest
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publiceer de release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ZENiX Bridge ${{ github.ref_name }}
          files: artifacts/windows-exe/ZENiXBridge.exe
          body: |
            **ZENiX Bridge ${{ github.ref_name }}** — `.rbtproject` ⇄ Excel.

            - **Windows 10/11 (x64)**: `ZENiXBridge.exe` — dubbelklikken, niets te
              installeren, geen Java nodig (de JRE zit erin).
            - **RingBus Tool is vereist**: de vendor-bibliotheek zit niet in de exe
              en wordt uit je RingBus Tool-installatie geladen (of uit
              `RINGBUSTOOL_HOME`).
            - Je projectsleutel hoort in `keys.txt` naast de exe.
            - Handleiding: <https://freevn.github.io/ZENiX-Bridge/>

            Dit is de **Bridge** (converter). De **ZENiX Ringbus Editor** is een
            apart product met een eigen repo en exe: <https://github.com/FreeVN/ZENiX-Editor>.
